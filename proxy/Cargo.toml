[package]
name = "trimset-proxy"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false
description = "trimset's front door: the proxy in Rust, everything else passed to the Python server (ADR 0015)."

# Exact versions, each at least 7 days old when chosen (the supply-chain hold); Cargo.lock
# pins the rest. Check a bump with tools/crate_ages.py.
[dependencies]
bytes = "=1.12.1"
hmac = "=0.13.0"
http = "=1.5.0"
http-body-util = "=0.1.5"
hyper = { version = "=1.12.0", features = ["client", "http1", "server"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tokio = { version = "=1.54.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid = { version = "=1.29.0", features = ["v7"] }
webpki-roots = "=1.0.11"

[profile.release]
lto = "thin"
codegen-units = 1
