[project]
name = "trimset-server"
version = "0.0.0"
description = "trimset server and worker: proxy, ingest, outcomes, policies, drift and alerts."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httptools>=0.9.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "opentelemetry-instrumentation-asyncpg>=0.66b2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "trimset",
    "trimset-stats",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0 ; sys_platform != 'win32'",
]

[project.scripts]
trimset-server = "trimset_server.cli:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
