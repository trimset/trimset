# All of trimset on one machine (NFR-01): `docker compose up -d`.
# Needs a .env file next to this one:
#   echo "TRIMSET_DB_PASSWORD=$(openssl rand -hex 16)" > .env
#   echo "TRIMSET_SECRET=$(openssl rand -hex 32)" >> .env
# Upstreams are defined there too, e.g. a local Ollaya (ADR 0011):
#   TRIMSET_UPSTREAM_OLLAYA_URL=http://host.docker.internal:11435
# The server and the worker both migrate the database when they start (advisory lock).
name: trimset

services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: trimset
      POSTGRES_DB: trimset
      POSTGRES_PASSWORD: ${TRIMSET_DB_PASSWORD:?Set TRIMSET_DB_PASSWORD in .env, letters and digits only}
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18 images keep data under a versioned subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimset -d trimset"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build: .
    image: ghcr.io/trimset/trimset:dev
    command: ["serve"]
    env_file: &trimset-env-file
      - path: .env # operator settings such as TRIMSET_UPSTREAM_*
        required: false
    environment: &trimset-env
      TRIMSET_DATABASE_URL: postgresql://trimset:${TRIMSET_DB_PASSWORD}@postgres:5432/trimset
      TRIMSET_SECRET: ${TRIMSET_SECRET:?Set TRIMSET_SECRET in .env, at least 32 characters}
      TRIMSET_AUTO_MIGRATE: "true"
    ports:
      - "8800:8800"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  worker:
    image: ghcr.io/trimset/trimset:dev
    command: ["worker"]
    env_file: *trimset-env-file
    environment: *trimset-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
