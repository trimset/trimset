# All of trimset on one machine (NFR-01): `docker compose up -d`.
# Needs a .env file next to this one with TRIMSET_DB_PASSWORD (letters and digits only):
#   echo "TRIMSET_DB_PASSWORD=$(openssl rand -hex 16)" > .env
# The migrate and worker services join in T1.4 (docs/04-plan.md).
name: trimset

services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    environment:
      POSTGRES_USER: trimset
      POSTGRES_DB: trimset
      POSTGRES_PASSWORD: ${TRIMSET_DB_PASSWORD:?Set TRIMSET_DB_PASSWORD in .env, letters and digits only}
    volumes:
      - pgdata:/var/lib/postgresql # Postgres 18 images keep data under a versioned subdirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trimset -d trimset"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  server:
    build: .
    image: ghcr.io/trimset/trimset:dev
    command: ["serve"]
    environment:
      TRIMSET_DATABASE_URL: postgresql://trimset:${TRIMSET_DB_PASSWORD}@postgres:5432/trimset
    ports:
      - "8800:8800"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8800/ready', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  pgdata:
