[project]
name = "trimset"
version = "0.0.0"
description = "Python SDK and CLI for trimset: gate decisions locally with live, calibrated policies."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "rfc8785>=0.1.4",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]

[project.scripts]
trimset = "trimset.cli:main"

[project.urls]
Homepage = "https://github.com/trimset/trimset"

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"
