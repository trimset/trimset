# The source of truth for tests (docs/05-testing.md). Runs on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in step with [tool.uv] exclude-newer in pyproject.toml (7-day supply-chain hold).
  UV_EXCLUDE_NEWER: "2026-11-03T00:00:00Z"

jobs:
  # Which checks a change can affect, so a PR runs only those. The others are skipped,
  # which branch protection counts as passing. Prose and the site affect none; a file
  # this doesn't recognise, the workflow, the Dockerfile or compose run everything, and so
  # does any failure here (the jobs below run unless this succeeded and said no).
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.sort.outputs.code }}
      rust: ${{ steps.sort.outputs.rust }}
      api: ${{ steps.sort.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: sort
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          code=false rust=false api=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || ! git cat-file -e "${BASE:-none}^{commit}"; then
            code=true rust=true api=true
          else
            git diff --name-only "$BASE" HEAD > changed.txt
            while read -r f; do
              case "$f" in
                *.md | site/* | wrangler.jsonc | LICENSE | NOTICE | .gitignore) ;;
                docs/03-api/*) api=true code=true ;; # the server's and SDK's tests read them
                docs/*) ;;
                proxy/*) rust=true ;;
                .github/workflows/ci.yml | Dockerfile | compose*.yaml) code=true rust=true api=true ;;
                .github/workflows/*) ;; # nightly and load run on their own triggers
                *) code=true ;;
              esac
            done < changed.txt
            sed 's/^/  /' changed.txt
          fi
          printf 'code=%s\nrust=%s\napi=%s\n' "$code" "$rust" "$api" | tee -a "$GITHUB_OUTPUT"

  lint:
    name: lint and types
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy

  test:
    name: test ${{ matrix.package }}
    needs: changes
    # Skipped at the job level, a matrix job would report one check under an unexpanded
    # name, and "test server" would never arrive. So the job runs and its steps skip.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { package: sdk/python, module: trimset, coverage: 90 }
          - { package: stats, module: trimset_stats, coverage: 95 }
          - { package: server, module: trimset_server, coverage: 85 }
          - { package: tools, module: trimset_tools, coverage: 90 }
    # Postgres for the server's integration tests; the other packages ignore it.
    services:
      postgres:
        image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TRIMSET_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      RUN: ${{ needs.changes.result != 'success' || needs.changes.outputs.code == 'true' }}
    steps:
      - if: env.RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: env.RUN == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - if: env.RUN == 'true'
        run: uv sync --locked
      - if: env.RUN == 'true'
        run: >-
          uv run --frozen pytest ${{ matrix.package }}/tests
          --cov=${{ matrix.module }} --cov-report=term-missing
          --cov-fail-under=${{ matrix.coverage }}

  proxy:
    name: proxy (Rust)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show active-toolchain # installs the one rust-toolchain.toml pins
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  sdk-oldest-python:
    name: SDK on Python 3.11
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv run --no-project --python 3.11 --with ./sdk/python --with pytest pytest sdk/python/tests

  image:
    name: image and compose smoke test
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true' || needs.changes.outputs.rust == 'true') }}
    runs-on: ubuntu-24.04
    env:
      TRIMSET_DB_PASSWORD: ciOnlyNotASecret
      TRIMSET_SECRET: ci-only-not-a-secret-0123456789abcdef
      COMPOSE_FILE: compose.yaml:compose.mock.yaml # the stack plus the mock upstream (FR-59)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 120
      - name: health and readiness
        run: curl -fsS http://127.0.0.1:8800/health && curl -fsS http://127.0.0.1:8800/ready
      - name: migrations ran, partitions exist, migrate is idempotent (NFR-15)
        run: |
          n=$(docker compose exec -T postgres psql -U trimset -d trimset -tAc "SELECT count(*) FROM pg_inherits WHERE inhparent = 'decisions'::regclass")
          echo "$n partitions"; test "$n" -ge 4
          test "$(docker compose exec -T server trimset-server migrate)" = '{"applied": []}'
      - name: no key, no access; the bootstrap key works (FR-52, FR-53)
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8800/v1/admin/keys)" = 401
          docker compose exec -T server trimset-server create-project ci > /dev/null
          key=$(docker compose exec -T server trimset-server create-key ci --label ci | python3 -c "import json,sys; print(json.load(sys.stdin)['key'])")
          curl -fsS -H "Authorization: Bearer $key" http://127.0.0.1:8800/v1/admin/keys > /dev/null
      - name: the proxy forwards to the mock upstream and records decisions (FR-04, FR-59)
        run: |
          proxy=$(docker compose exec -T server trimset-server create-key ci --scope proxy --label app | python3 -c "import json,sys; print(json.load(sys.stdin)['key'])")
          echo "PROXY_KEY=$proxy" >> "$GITHUB_ENV"
          curl -fsS -D headers.txt -o answer.json "http://127.0.0.1:8800/p/$proxy/v1/systemone" \
            -H 'content-type: application/json' \
            -d '{"model": "mock-latest", "state": {"ticket": "t-1"}, "questions": {"fraud": {"type": "noul", "instructions": "Is this fraud?"}, "team": {"type": "choice", "instructions": "Which team?", "criteria": {"billing": null, "tech": null}}}}'
          python3 -c "import json; a = json.load(open('answer.json')); assert a['model'] == 'mock-1.0.0', a"
          grep -i '^x-trimset-decision-id: [0-9a-f-]*,[0-9a-f-]*' headers.txt
          for i in $(seq 20); do
            n=$(docker compose exec -T postgres psql -U trimset -d trimset -tAc "SELECT count(*) FROM decisions")
            [ "$n" = 2 ] && break; sleep 0.5
          done
          echo "$n decisions"; test "$n" = 2
          curl -fsS http://127.0.0.1:9000/_mock/last | python3 -c "import json,sys; last = json.load(sys.stdin)['last']; assert last['path'] == '/v1/systemone', last; assert not [h for h in last['headers'] if h.startswith('x-trimset')], last"
      - name: the M1 demo runs end to end (T1.15, examples/m1-capture)
        run: examples/m1-capture/run.sh
      - name: the M2 demo runs end to end (T2.8, examples/m2-refund-fraud)
        run: examples/m2-refund-fraud/run.sh
      - name: the M3 demo runs end to end (T3.7, examples/m3-ticket-triage)
        run: examples/m3-ticket-triage/run.sh
      - name: every log line is JSON (NFR-13)
        run: |
          docker compose logs --no-log-prefix server worker proxy > stack.log
          python3 -c "import json,sys; lines=[l for l in open('stack.log') if l.strip()]; [json.loads(l) for l in lines]; print(len(lines), 'JSON lines')"
          ! grep -qF "$PROXY_KEY" stack.log # the key in the proxy's path is redacted
      - name: runs as a non-root user
        run: test "$(docker compose exec -T server id -u)" = 10001
      - name: memory at idle (NFR-17, recorded)
        run: docker stats --no-stream --format '{{.Name}} {{.MemUsage}}'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  contracts:
    name: API contracts and test vectors
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.api == 'true') }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: docs/03-api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uvx --from openapi-spec-validator==0.7.2 openapi-spec-validator openapi.yaml
      - run: |
          for s in question record outcome fit policy drift_report bundle; do
            uvx --from check-jsonschema==0.33.0 check-jsonschema \
              --schemafile schemas/$s.schema.json examples/$s.json
          done
      - run: uv run --no-project --with rfc8785==0.1.4 python vectors/generate.py --check
