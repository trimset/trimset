# Experiments that take minutes (docs/05-testing.md, marker `slow`), every night and by
# hand: the coverage experiment (NFR-09). Results land in the run's summary.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_EXCLUDE_NEWER: "2026-11-03T00:00:00Z"

jobs:
  experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --locked
      - name: coverage experiment, 200 seeds (NFR-09, SM-2)
        env:
          TRIMSET_RESEARCH_OUT: research-out
        run: uv run --frozen pytest research -m slow -q
      - name: results
        if: always()
        run: |
          {
            echo "## Coverage experiment"
            for f in research-out/*.json; do echo '```json'; cat "$f"; echo '```'; done
          } | tee -a "$GITHUB_STEP_SUMMARY"
